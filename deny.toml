# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/),
# run by CI: `cargo deny check`.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
version = 2
# Known vulnerabilities in any dependency fail the check. Unmaintained
# crates only count when we depend on them directly.
unmaintained = "workspace"
yanked = "deny"

[licenses]
version = 2
# Licences compatible with shipping Moriartty under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# A few crates (toml, ...) appear in two versions through gtk's build
# dependencies; report it, don't fail on it.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"

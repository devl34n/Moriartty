<?xml version="1.0" encoding="UTF-8"?>
<!-- Symbolic (monochrome) icon: the logo's top hat, with its band left open.
     Desktops recolour it to match their theme. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill="#222222">
    <!-- crown, above the band -->
    <path d="M3.5 2.2C3.5 1.5 5.5 1 8 1s4.5.5 4.5 1.2L11.8 8H4.2z"/>
    <!-- crown, below the band -->
    <path d="M4.1 9.2h7.8l-.15 1.3H4.25z"/>
    <!-- brim -->
    <path d="M1 11.8c0-.9 2-1.3 3.3-1.3h7.4c1.3 0 3.3.4 3.3 1.3C15 13.3 11.9 14 8 14s-7-.7-7-2.2z"/>
  </g>
</svg>
